{% extends "base.html" %}
{% set title="Map Game" %}
{% block head_extra %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
{% endblock %}
{% block content %}
  <div class="page map-page">
    <div class="topbar">
      <a class="topbar-home" href="/">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5Z"/></svg>
        </span>
        Home
      </a>

      <div class="topbar-right hud">
        <div class="hud-item">
          <span class="hud-icon i-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"></path></svg>
          </span>
          <span id="map-score">0</span><span class="muted"> / </span><span id="map-total">10</span>
        </div>
        <div class="hud-item">
          <span class="hud-icon i-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 3 4 3 4 7a4 4 0 0 1-8 0c0-4 3-4 4-7Z"></path><path d="M6 14a6 6 0 1 0 12 0"></path></svg>
          </span>
          <span id="map-streak">0</span>
        </div>
        <button class="icon-btn" id="map-reset" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
        </button>
      </div>
    </div>

 <div class="map-banner" id="map-banner">
  <!-- LEFT -->
  <div class="banner-left">
    <span class="banner-left-text banner-sub" id="hotcold">—</span>
  </div>

  <!-- CENTER -->
  <div class="banner-center">
    <span class="target">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v3"></path>
        <path d="M12 19v3"></path>
        <path d="M2 12h3"></path>
        <path d="M19 12h3"></path>
      </svg>
    </span>

    <span class="banner-text">
      Click on:
      <span class="flag-emoji" id="target-flag">🏳️</span>
      <span id="target-name">—</span>
    </span>
  </div>

  <!-- RIGHT -->
  <div class="banner-right">
    <span class="attempt-pill banner-sub" id="attempts-left">3</span>
  </div>
</div>

<div id="map" class="map-canvas"></div>


  </div>
{% endblock %}

{% block scripts %}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
