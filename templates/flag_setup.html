{% extends "base.html" %}
{% set title="Flag Challenge" %}
{% block content %}
  <div class="page center-page">
    <div class="topbar">
      <a class="topbar-home" href="/">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5Z"/></svg>
        </span>
        Home
      </a>
      <div class="topbar-right"></div>
    </div>

    <div class="modal-card">
      <div class="modal-icon i-green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22V4"></path><path d="M4 4h12l-2 5 2 5H4"></path></svg>
      </div>
      <h2 class="modal-title">Flag Challenge</h2>
      <p class="modal-sub">Test your knowledge of world flags</p>

      <div class="field">
        <label>Select Difficulty</label>
        <select id="difficulty" class="select">
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium </option>
          <option value="hard">Hard </option>
        </select>
      </div>

      <div class="field">
        <label>Number of Questions</label>
        <select id="total" class="select">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="unlimited">Unlimited</option>
        </select>
      </div>

      <button class="btn btn-primary btn-wide" id="start-flags">
        Start Challenge <span class="chev">›</span>
      </button>

      <a class="back-link" href="/">← Back to Home</a>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/flag_setup.js') }}"></script>
{% endblock %}
