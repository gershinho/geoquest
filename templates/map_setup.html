{% extends "base.html" %}
{% set title="Map Challenge" %}
{% block content %}
  <main class="page center-page">
    <div class="modal-card">
      <div class="modal-icon i-blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10Z"></path><circle cx="12" cy="11" r="2"></circle></svg>
      </div>
      <h1 class="modal-title">Map Challenge</h1>
      <p class="modal-sub">Click on the map to locate countries</p>

      <div class="field">
        <label for="region">Select region</label>
        <select id="region" class="select">
          <option value="All" selected>All Countries</option>
          <option value="Africa">Africa</option>
          <option value="Europe">Europe</option>
          <option value="Asia">Asia</option>
          <option value="Americas">Americas</option>
          <option value="Oceania">Oceania</option>
        </select>
      </div>

      <div class="field">
        <label for="attempts">Attempts per country</label>
        <select id="attempts" class="select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <button class="btn btn-primary btn-wide" id="start-map">
        Start Challenge <span class="chev">›</span>
      </button>

      <a class="back-link" href="/">← Back to Home</a>
    </div>
  </main>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/map_setup.js') }}"></script>
{% endblock %}
