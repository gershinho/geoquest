<section class="round-results game-card" id="round-results" aria-labelledby="results-title" hidden>
  <h1 id="results-title" tabindex="-1">Round complete</h1>
  <p id="results-score" class="results-score"></p>
  <div class="results-metrics" id="results-metrics"></div>
  <h2 id="results-review-title" hidden>Worth another try</h2>
  <ul id="results-review" class="results-review" hidden></ul>
  <div class="results-actions">
    <button class="btn btn-primary" id="results-retry" type="button" hidden>Retry missed questions</button>
    <button class="btn btn-outline" id="results-restart" type="button">New round</button>
    <a class="topbar-home" href="/">Home</a>
  </div>
</section>
