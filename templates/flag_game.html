{% extends "base.html" %}
{% set title="Flag Game" %}
{% block content %}
  <main class="page">
    <div id="flag-round">
      <header class="round-nav">
        <span class="round-title">Flag Challenge</span>
        <span id="flag-progress">Question 1 of 10</span>
        <span>Score <strong id="hud-score">0</strong></span>
      </header>

      <div class="game-wrap">
        <section class="game-card" aria-label="Flag question">
          <div class="flag-controls">
            <a href="/flags" class="text-link">Round settings</a>
            <button class="btn btn-ghost" id="finish-flags" type="button" disabled>Finish round</button>
          </div>
          <h1 class="question">Which country does this flag belong to?</h1>

          <div class="flag-box">
            <img id="flag-img" alt="Flag to identify">
          </div>

          <div class="options-grid" id="options"></div>
          <form id="flag-type-area" class="flag-type" hidden>
            <input id="flag-input" aria-label="Country name" placeholder="Type a country name" autocomplete="off">
            <button class="btn btn-primary" type="submit">Submit</button>
          </form>

          <p class="feedback" id="feedback" role="status" hidden></p>
          <div class="flag-actions">
            <button class="btn btn-ghost" id="flag-reveal" type="button">Reveal answer</button>
            <button class="btn btn-primary" id="next-btn" type="button" hidden>Next flag</button>
          </div>
        </section>
      </div>
    </div>
    {% include "round_results.html" %}
  </main>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/flags.js') }}"></script>
{% endblock %}
