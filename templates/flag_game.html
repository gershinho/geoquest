{% extends "base.html" %}
{% set title="Flag Game" %}
{% block content %}
  <div class="page">
    <div class="topbar">
      <a class="topbar-home" href="/">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5Z"/></svg>
        </span>
        Home
      </a>

      <div class="topbar-right hud">
        <div class="hud-item">
          <span class="hud-icon i-green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"></path></svg>
          </span>
          <span id="hud-score">0</span><span class="muted"> / </span><span id="hud-total">10</span>
        </div>
        <div class="hud-item">
          <span class="hud-icon i-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 3 4 3 4 7a4 4 0 0 1-8 0c0-4 3-4 4-7Z"></path><path d="M6 14a6 6 0 1 0 12 0"></path></svg>
          </span>
          <span id="hud-streak">0</span>
        </div>
        <button class="icon-btn" id="hud-reset" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
        </button>
      </div>
    </div>

    <div class="game-wrap">
      <div class="game-card">
        <div class="question">Which country does this flag belong to?</div>

        <div class="flag-box">
          <img id="flag-img" alt="flag" />
        </div>

        <div class="options-grid" id="options"></div>
        <div id="flag-type-area" style="display:none; margin-top:12px;">
          <input id="flag-input" placeholder="Type country name..." style="padding:8px; width:70%;" />
          <button id="flag-submit" class="btn btn-primary" style="margin-left:8px;">Submit</button>
        </div>

        <div class="feedback" id="feedback" hidden></div>

        <button class="btn btn-primary btn-wide" id="next-btn" disabled>
          Next Flag <span class="chev">›</span>
        </button>
      </div>

      <div class="best-pill" id="best-pill">🏆 Best: 0</div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/flags.js') }}"></script>
{% endblock %}
